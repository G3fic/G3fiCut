name: gifcut
description: A Windows-first video editor with timeline-based audio extraction.
publish_to: "none"
# Release GifCut v0.3.80
version: 0.3.80+88


environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  file_picker: ^8.1.7
  super_drag_and_drop: ^0.9.1
  path: ^1.9.0
  path_provider: ^2.1.5
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
