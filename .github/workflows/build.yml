name: Build ClipForge for Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows desktop app
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        id: release-version
        shell: pwsh
        run: |
          $version = '0.2.0'
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)$') {
              $version = $Matches[1]
            } else {
              throw 'Release tags must use vMAJOR.MINOR.PATCH, for example v0.2.1.'
            }
          }
          "CLIPFORGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform scaffolding
        shell: pwsh
        run: flutter create --platforms=windows --project-name clipforge .

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release "--dart-define=APP_VERSION=$env:CLIPFORGE_VERSION"

      - name: Add FFmpeg runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -Path $extract -Filter 'ffmpeg.exe' -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg) { throw 'ffmpeg.exe was not found in the LGPL package.' }
          $release = Join-Path $PWD 'build/windows/x64/runner/Release'
          Copy-Item -Path $ffmpeg.FullName -Destination (Join-Path $release 'ffmpeg.exe') -Force
          $notice = @(
            'ClipForge bundles the FFmpeg LGPL build for Windows.'
            'Upstream project: https://ffmpeg.org/'
            'Binary provider: https://github.com/BtbN/FFmpeg-Builds'
            'FFmpeg source and licensing information: https://ffmpeg.org/legal.html'
            'Review the upstream FFmpeg license and build configuration before redistribution.'
          ) -join [Environment]::NewLine
          Set-Content -Path (Join-Path $release 'FFmpeg-LICENSE-NOTICE.txt') -Value $notice -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DMyAppVersion=$env:CLIPFORGE_VERSION" installer\ClipForge.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Windows-Installer
          path: build/installer/ClipForge-Setup-${{ env.CLIPFORGE_VERSION }}.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClipForge-Windows-Installer
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ClipForge v${{ needs.windows.outputs.release_version }}
          generate_release_notes: true
          files: release-assets/ClipForge-Setup-${{ needs.windows.outputs.release_version }}.exe
          fail_on_unmatched_files: true
