name: Build GifCut for Windows

on:
  push:
    branches: [main, master, 'feature/**', 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Semantic version to publish (e.g. 0.2.5). Leave blank for a test build.'
        required: false
        type: string
        default: ''

concurrency:
  group: gifcut-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows desktop app
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        id: release-version
        shell: pwsh
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $pubspecVersionLine = Get-Content 'pubspec.yaml' | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          if ($null -eq $pubspecVersionLine) {
            throw 'Could not read version from pubspec.yaml.'
          }
          if ($pubspecVersionLine -match '^version:\s*(\d+\.\d+\.\d+)(?:\+\d+)?\s*$') {
            $version = $Matches[1]
          } else {
            throw 'Could not read semantic version from pubspec.yaml.'
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and -not [string]::IsNullOrWhiteSpace($env:RELEASE_VERSION_INPUT)) {
            if ($env:RELEASE_VERSION_INPUT -notmatch '^\d+\.\d+\.\d+$') {
              throw 'Release version must use MAJOR.MINOR.PATCH, for example 0.2.5.'
            }
            $version = $env:RELEASE_VERSION_INPUT
          } elseif ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)$') {
              $version = $Matches[1]
            } else {
              throw 'Release tags must use vMAJOR.MINOR.PATCH, for example v0.2.2.'
            }
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main' -and $env:RELEASE_COMMIT_MESSAGE -like 'Release GifCut v*') {
            if ($env:RELEASE_COMMIT_MESSAGE -match '^Release GifCut v(\d+\.\d+\.\d+)(:|\r?\n|$)') {
              $version = $Matches[1]
            } else {
              throw 'Release commits must start with: Release GifCut vMAJOR.MINOR.PATCH:'
            }
          }
          "GIFCUT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Generate Windows platform scaffolding
        shell: pwsh
        run: flutter create --no-pub --platforms=windows --project-name gifcut .

      - name: Apply GifCut Windows app icon
        shell: pwsh
        run: |
          $icon = Join-Path $PWD 'assets/gifcut.ico'
          $target = Join-Path $PWD 'windows/runner/resources/app_icon.ico'
          if (-not (Test-Path $icon)) { throw "GifCut app icon not found: $icon" }
          if (-not (Test-Path (Split-Path $target))) { New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null }
          Copy-Item $icon $target -Force

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release "--dart-define=APP_VERSION=$env:GIFCUT_VERSION"

      - name: Add FFmpeg runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -Path $extract -Filter 'ffmpeg.exe' -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg) { throw 'ffmpeg.exe was not found in the LGPL package.' }
          $release = Join-Path $PWD 'build/windows/x64/runner/Release'
          Copy-Item -Path $ffmpeg.FullName -Destination (Join-Path $release 'ffmpeg.exe') -Force
          $notice = @(
            'GifCut bundles the FFmpeg LGPL build for Windows.'
            'Upstream project: https://ffmpeg.org/'
            'Binary provider: https://github.com/BtbN/FFmpeg-Builds'
            'FFmpeg source and licensing information: https://ffmpeg.org/legal.html'
            'Review the upstream FFmpeg license and build configuration before redistribution.'
          ) -join [Environment]::NewLine
          Set-Content -Path (Join-Path $release 'FFmpeg-LICENSE-NOTICE.txt') -Value $notice -Encoding utf8

      - name: Verify required FFmpeg filters
        shell: pwsh
        run: |
          $ffmpeg = Join-Path $PWD 'build/windows/x64/runner/Release/ffmpeg.exe'
          $filters = & $ffmpeg -hide_banner -filters 2>&1 | Out-String
          foreach ($filter in @('xfade', 'lut3d', 'noise', 'chromashift', 'rgbashift', 'vignette', 'unsharp', 'colorchannelmixer', 'hue', 'lutrgb')) {
            if ($filters -notmatch "(?m)\b$filter\b") {
              Write-Output $filters
              throw "The bundled FFmpeg build does not include required filter: $filter"
            }
          }
          & $ffmpeg -hide_banner -h filter=xfade 2>&1 | Out-File "$env:RUNNER_TEMP/xfade-help.txt"
          $xfade = Get-Content "$env:RUNNER_TEMP/xfade-help.txt" -Raw
          foreach ($transition in @('circlecrop', 'radial', 'smoothleft', 'zoomin', 'coverleft', 'revealright')) {
            if ($xfade -notmatch "(?m)\b$transition\b") {
              throw "The bundled FFmpeg xfade filter is missing transition: $transition"
            }
          }

      - name: Download CC BY 4.0 cinematic LUT presets
        shell: pwsh
        run: |
          $release = Join-Path $PWD 'build/windows/x64/runner/Release'
          $lutDirectory = Join-Path $release 'luts'
          New-Item -ItemType Directory -Path $lutDirectory -Force | Out-Null
          $baseUrl = 'https://raw.githubusercontent.com/slaycamera/luts/a1709044efe115640dde1dee17d4185fc059af0d/luts'
          $lutFiles = @(
            'slay-01-amber.cube',
            'slay-02-fade.cube',
            'slay-03-neon.cube',
            'slay-04-film.cube',
            'slay-05-portrait.cube'
          )
          foreach ($name in $lutFiles) {
            $destination = Join-Path $lutDirectory $name
            Invoke-WebRequest -Uri "$baseUrl/$name" -OutFile $destination
            if ((Get-Item $destination).Length -lt 900000) {
              throw "Downloaded LUT file appears incomplete: $name"
            }
          }
          $attribution = @(
            'Cinematic LUT presets by slaycamera',
            'Source: https://github.com/slaycamera/luts',
            'License: Creative Commons Attribution 4.0 International (CC BY 4.0)',
            'License text: https://creativecommons.org/licenses/by/4.0/',
            'Attribution: LUTs: slay (CC BY 4.0)',
            'The original LUT data is redistributed unchanged.'
          ) -join [Environment]::NewLine
          Set-Content -Path (Join-Path $lutDirectory 'ATTRIBUTION.txt') -Value $attribution -Encoding utf8

      - name: Smoke-test LUTs, effects and blurred aspect-ratio canvas
        shell: pwsh
        run: |
          $ffmpeg = Join-Path $PWD 'build/windows/x64/runner/Release/ffmpeg.exe'
          $lut = (Join-Path $PWD 'build/windows/x64/runner/Release/luts/slay-04-film.cube') -replace '\\', '/'
          $lut = $lut -replace ':', '\:'
          $sampleFilters = @(
            "lut3d=file='$lut':interp=tetrahedral",
            'noise=alls=12:allf=t+u',
            'chromashift=cbh=3:crh=-3',
            'format=rgba,rgbashift=rh=5:rv=0:gh=-3:gv=1:bh=2:bv=-1',
            "lutrgb=r='clip((val-128)*1.12+128,0,255)':g='clip((val-128)*1.12+128,0,255)':b='clip((val-128)*1.12+128,0,255)',hue=s=0.92",
            'vignette=angle=PI/5',
            'unsharp=5:5:1.1:5:5:0.0'
          )
          foreach ($filter in $sampleFilters) {
            & $ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=64x64:rate=30' -vf $filter -frames:v 1 -f null NUL
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg effect smoke test failed: $filter" }
          }

          $canvasGraph = '[0:v]split=2[fitSource][backdropSource];[backdropSource]scale=64:96:force_original_aspect_ratio=increase,crop=64:96,gblur=sigma=18,lutrgb=r='clip(val*0.62,0,255)':g='clip(val*0.62,0,255)':b='clip(val*0.62,0,255)',hue=s=0.82[backdrop];[fitSource]scale=64:96:force_original_aspect_ratio=decrease,format=rgba,pad=64:96:(ow-iw)/2:(oh-ih)/2:color=black@0,setsar=1[foreground];[backdrop][foreground]overlay=(W-w)/2:(H-h)/2:shortest=1,setsar=1,format=yuv420p[out]'
          & $ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=96x64:rate=30:duration=1' -filter_complex $canvasGraph -map '[out]' -frames:v 1 -f null NUL
          if ($LASTEXITCODE -ne 0) { throw 'Blurred aspect-ratio canvas composition smoke test failed.' }

          $transitionGraph = '[0:v]settb=AVTB,setpts=PTS-STARTPTS,fps=30,format=yuv420p[a];[1:v]settb=AVTB,setpts=PTS-STARTPTS,fps=30,format=yuv420p[b];[a][b]xfade=transition=radial:duration=0.3:offset=0.5[out]'
          & $ffmpeg -hide_banner -loglevel error -f lavfi -i 'testsrc2=size=64x64:rate=30:duration=1' -f lavfi -i 'smptebars=size=64x64:rate=30:duration=1' -filter_complex $transitionGraph -map '[out]' -frames:v 1 -f null NUL
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg xfade transition smoke test failed.' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DMyAppVersion=$env:GIFCUT_VERSION" installer\ClipForge.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          # Keep legacy asset names so older G3fiCut and ClipForge updaters can install this build.
          Copy-Item "build/installer/GifCut-Setup-$env:GIFCUT_VERSION.exe" "build/installer/G3fiCut-Setup-$env:GIFCUT_VERSION.exe" -Force
          Copy-Item "build/installer/GifCut-Setup-$env:GIFCUT_VERSION.exe" "build/installer/ClipForge-Setup-$env:GIFCUT_VERSION.exe" -Force

      - name: Package portable app archive for in-app updates
        shell: pwsh
        run: |
          $release = Join-Path $PWD 'build/windows/x64/runner/Release'
          $archive = Join-Path $PWD "build/installer/GifCut-$env:GIFCUT_VERSION-win-x64.zip"
          if (-not (Test-Path (Join-Path $release 'gifcut.exe'))) { throw 'gifcut.exe is missing from the Windows release directory.' }
          Compress-Archive -Path (Join-Path $release '*') -DestinationPath $archive -CompressionLevel Optimal -Force
          if (-not (Test-Path $archive)) { throw "Portable update archive was not created: $archive" }

      - uses: actions/upload-artifact@v4
        with:
          name: GifCut-Windows-Installer
          path: |
            build/installer/GifCut-Setup-${{ env.GIFCUT_VERSION }}.exe
            build/installer/G3fiCut-Setup-${{ env.GIFCUT_VERSION }}.exe
            build/installer/ClipForge-Setup-${{ env.GIFCUT_VERSION }}.exe
            build/installer/GifCut-${{ env.GIFCUT_VERSION }}-win-x64.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GifCut-Windows-Installer
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.release_version }}
          target_commitish: ${{ github.sha }}
          name: GifCut v${{ needs.windows.outputs.release_version }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            release-assets/GifCut-Setup-${{ needs.windows.outputs.release_version }}.exe
            release-assets/G3fiCut-Setup-${{ needs.windows.outputs.release_version }}.exe
            release-assets/ClipForge-Setup-${{ needs.windows.outputs.release_version }}.exe
            release-assets/GifCut-${{ needs.windows.outputs.release_version }}-win-x64.zip
          fail_on_unmatched_files: true
